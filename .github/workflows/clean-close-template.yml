name: One-time clean CLOSE_BUTTON template

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/clean-close-template.yml"

permissions:
  contents: write

jobs:
  clean-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Remove background outside circular close button
        shell: bash
        run: |
          python - <<'PY'
          from PIL import Image
          import math

          path = "app/src/main/assets/templates/CLOSE_BUTTON_1.png"
          image = Image.open(path).convert("RGBA")
          w, h = image.size

          # Preserve the original 97x94 canvas and button center.
          cx = (w - 1) / 2.0
          cy = (h - 1) / 2.0
          rx = min(w, h) * 0.485
          ry = min(w, h) * 0.485

          px = image.load()
          for y in range(h):
              for x in range(w):
                  # Elliptical distance from the close button center.
                  d = math.sqrt(((x - cx) / rx) ** 2 + ((y - cy) / ry) ** 2)

                  # Keep the button fully opaque, feather only its outer edge,
                  # and make the old purple/background corners transparent.
                  if d <= 0.965:
                      alpha = 255
                  elif d >= 1.0:
                      alpha = 0
                  else:
                      alpha = round(255 * (1.0 - (d - 0.965) / 0.035))

                  r, g, b, _ = px[x, y]
                  px[x, y] = (r, g, b, alpha)

          image.save(path, "PNG", optimize=True)
          print(f"cleaned {path}: {w}x{h}, center=({cx:.1f},{cy:.1f})")
          PY

      - name: Commit cleaned template
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- app/src/main/assets/templates/CLOSE_BUTTON_1.png; then
            echo "No template change needed."
            exit 0
          fi

          git add app/src/main/assets/templates/CLOSE_BUTTON_1.png
          git commit -m "Clean CLOSE_BUTTON template background"
          git push origin HEAD:master
